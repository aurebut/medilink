services:
  - type: web
    name: medilink-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: medilink-backend-mvp
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npm prune --omit=dev
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: __Host-medilink_session
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_DAYS
        value: 7
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: ESCROW_PROVIDER
        value: disabled
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
